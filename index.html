<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="converter-card" aria-labelledby="page-title">

      <header class="card-header">
        <h1 id="page-title">Temperature Converter</h1>
        <p class="subtitle">
          Convert any temperature between Celsius, Fahrenheit and Kelvin instantly.
        </p>
      </header>

      <form id="converter-form" novalidate>
        <div class="form-group">
          <label for="temperature-input">Temperature value</label>
          <input
            type="number"
            id="temperature-input"
            step="any"
            inputmode="decimal"
            placeholder="e.g. 25 or -10.5"
            autocomplete="off"
            aria-describedby="message-box"
          >
        </div>

        <div class="form-group">
          <label for="unit-select">Convert from</label>
          <select id="unit-select">
            <option value="C">Celsius (°C)</option>
            <option value="F">Fahrenheit (°F)</option>
            <option value="K">Kelvin (K)</option>
          </select>
        </div>

        <!-- Validation / success messages appear here -->
        <div id="message-box" class="message" role="alert" aria-live="polite"></div>

        <div class="button-row">
          <button type="submit" id="convert-btn" class="btn btn-primary">
            Convert Temperature
          </button>
          <button type="button" id="reset-btn" class="btn btn-secondary">
            Reset
          </button>
        </div>
      </form>

      <section class="results" aria-labelledby="results-title" aria-live="polite">
        <h2 id="results-title">Results</h2>
        <div class="result-grid">
          <div class="result-item">
            <span class="result-label">Celsius</span>
            <span class="result-value" id="result-celsius">--</span>
          </div>
          <div class="result-item">
            <span class="result-label">Fahrenheit</span>
            <span class="result-value" id="result-fahrenheit">--</span>
          </div>
          <div class="result-item">
            <span class="result-label">Kelvin</span>
            <span class="result-value" id="result-kelvin">--</span>
          </div>
        </div>
      </section>

      <footer class="card-footer">
        <p>Built with HTML, CSS, and JavaScript</p>
      </footer>

    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
